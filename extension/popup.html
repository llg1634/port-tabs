<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Port Tabs</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        color: #1b1b1b;
        background: #f7f3e8;
        font: 13px/1.4 "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 1px solid #b8ad99;
        border-radius: 6px;
        background: #fffdf7;
        font: inherit;
      }

      textarea {
        min-height: 68px;
        resize: vertical;
      }

      button {
        margin-top: 10px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: #1e5f46;
        cursor: pointer;
      }

      button.secondary {
        margin-left: 6px;
        color: #1b1b1b;
        background: #ded2bb;
      }

      code {
        display: block;
        margin-top: 8px;
        padding: 8px;
        border-radius: 6px;
        overflow-wrap: anywhere;
        background: #eee4d1;
      }

      .status {
        margin-top: 10px;
        min-height: 18px;
      }

      .help {
        margin-top: 6px;
        color: #625846;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Browser Control Port</h1>
    <div id="connection">Checking...</div>
    <label for="port">Port</label>
    <input id="port" type="number" min="1024" max="65535" step="1">
    <label for="profileName">Name</label>
    <input id="profileName" type="text" maxlength="80" placeholder="Bilibili debug browser">
    <label for="profileNote">Note</label>
    <textarea id="profileNote" maxlength="500" placeholder="Optional profile/window description"></textarea>
    <label for="riskMode">Automation risk control</label>
    <select id="riskMode">
      <option value="soft">Soft warning (allow request)</option>
      <option value="hard">Hard limit (block request)</option>
      <option value="off">Off</option>
    </select>
    <label for="riskLimit">Max risky requests in rolling 30 seconds</label>
    <input id="riskLimit" type="number" min="1" max="1000" step="1" value="5">
    <div class="help">
      New-tab and reload requests share this count. A limit of 5 allows the first 5 requests; request 6 warns or blocks. Soft mode only adds a response warning and never sleeps automatically.
    </div>
    <button id="save">Save</button>
    <button id="reconnect" class="secondary">Reconnect</button>
    <code id="url"></code>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
